<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - SheShield AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #16001f, #42005c, #71008c);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            padding: 35px;
            border-radius: 25px;
            background: rgba(255,255,255,0.09);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 50px;
        }

        h1 {
            text-align: center;
            margin: 8px 0;
        }

        .subtitle {
            text-align: center;
            color: #d8c5df;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.25);
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #ff6ee8;
        }

        input::placeholder {
            color: #aaa;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #ff45d3, #a855f7);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .error {
            background: rgba(255,0,0,0.2);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            text-align: center;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
            color: #ddd;
        }

        .bottom a {
            color: #ff91ec;
            text-decoration: none;
            font-weight: bold;
        }

        .home {
            display: block;
            text-align: center;
            color: #ccc;
            text-decoration: none;
            margin-top: 18px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">🛡️</div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join SheShield AI and stay protected
        </p>

        {% if error %}
            <div class="error">
                ⚠️ {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="/register">

            <label>Full Name *</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label>Email Address *</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password *</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

            <label>Phone Number</label>

            <input
                type="tel"
                name="phone"
                placeholder="Enter your phone number"
            >

            <label>Emergency Contact</label>

            <input
                type="tel"
                name="emergency_contact"
                placeholder="Emergency contact number"
            >

            <button type="submit">
                🚀 Create My Account
            </button>

        </form>

        <div class="bottom">
            Already have an account?
            <a href="/login">Login</a>
        </div>

        <a href="/" class="home">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
